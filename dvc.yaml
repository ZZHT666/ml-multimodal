# Flickr30k pipeline (features are computed once on the VM by src/features.py and
# imported with `dvc import-url`, see scripts/flickr30k/README.md):
#
#   features/flickr30k-v1 (import-url) ─► train_flickr ─► assemble ─► build_index
#
#   dvc repro                         # re-runs only stages whose deps/params changed
#   dvc metrics show                  # outputs/flickr30k/metrics.json
#   dvc exp run -S train_flickr.lr=3e-3 -S train_flickr.embed_dim=512
#   dvc push                          # upload outputs to the GCS remote
#
# (The original synthetic-shapes demo still runs without DVC: `make train-synthetic`.)
stages:
  train_flickr:
    cmd: >-
      python -m src.train_features --features_dir features/flickr30k-v1
      --output_dir outputs/flickr30k
      --epochs ${train_flickr.epochs} --batch_size ${train_flickr.batch_size}
      --lr ${train_flickr.lr} --weight_decay ${train_flickr.weight_decay}
      --embed_dim ${train_flickr.embed_dim} --dropout ${train_flickr.dropout}
    deps:
      - features/flickr30k-v1
      - src/train_features.py
      - src/model.py
      - src/metrics.py
    params:
      - train_flickr
    outs:
      - outputs/flickr30k/heads.pt
    metrics:
      - outputs/flickr30k/metrics.json:
          cache: false
  assemble:
    cmd: python -m src.assemble --heads outputs/flickr30k/heads.pt --out outputs/flickr30k/fusion_model.pt
    deps:
      - outputs/flickr30k/heads.pt
      - src/assemble.py
      - src/model.py
    outs:
      - outputs/flickr30k/fusion_model.pt
  build_index:
    cmd: >-
      python -m src.build_index --checkpoint outputs/flickr30k/fusion_model.pt
      --features_dir features/flickr30k-v1 --snapshot data/flickr30k/pairs.parquet
      --out outputs/flickr30k/gallery_index.pt
    deps:
      - outputs/flickr30k/fusion_model.pt
      - features/flickr30k-v1
      - data/flickr30k
      - src/build_index.py
      - src/serving/index.py
      - src/serving/service.py
    outs:
      - outputs/flickr30k/gallery_index.pt
