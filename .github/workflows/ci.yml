name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_VERSION: "2.5.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU torch + deps
        run: |
          pip install torch==${TORCH_VERSION} --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests (fully offline -- tiny backbones, no HF downloads)
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q

  docker:
    # Build the serving image on every PR (catches Dockerfile breakage);
    # push to Artifact Registry only on main, and only once GCP is configured.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for Workload Identity Federation (no long-lived JSON keys)
    env:
      IMAGE: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ml-serving/clip-retrieval
      PUSH: ${{ github.event_name == 'push' && vars.GCP_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t clip-retrieval:${{ github.sha }} .
      - name: Smoke test the image (imports + CLI)
        run: docker run --rm --entrypoint python clip-retrieval:${{ github.sha }} -c "import src.serving.app"
      - if: env.PUSH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - if: env.PUSH == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - if: env.PUSH == 'true'
        name: Push to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev --quiet
          docker tag clip-retrieval:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:${{ github.sha }}
